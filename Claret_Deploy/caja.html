function defData(){ return {tasa:0,fondo_bs:0,fondo_usd:0,efectivo:{},efectivobs:[],dolares:[],zelle:[],transfer:[],debito:[],credito:[],gastos:[]}; }

function entrar(){

  }).catch(function(){

document.addEventListener('keydown', function(ev){
  var tag=(ev.target&&ev.target.tagName)||'';
  var typing=(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA');
  var modal=document.getElementById('modal');
  if(document.getElementById('voz-mic')){ if(ev.key==='Enter'){ ev.preventDefault(); vozTerminar(); return; } if(ev.key==='Escape'){ ev.preventDefault(); vozParar(); return; } }
  if(ev.key==='Escape'){ if(modal){ ev.preventDefault(); cerrarModal(); } return; }
  if(ev.key==='Enter' && modal && typing){
    var list=[].slice.call(modal.querySelectorAll('input,select')).filter(function(x){ return !x.disabled && x.offsetParent!==null; });
    var idx=list.indexOf(ev.target);
    if(idx>=0){ ev.preventDefault();
      if(idx<list.length-1){ var nx=list[idx+1]; nx.focus(); try{ if(nx.select)nx.select(); }catch(e){} }

function tot(){ var d=C.data, tasa=num(d.tasa); var efBs=0; DENOM.forEach(function(dn){ efBs+=dn*num((d.efectivo||{})[dn]); });

  var totalBs=ventaEf+transBs+debBs+credBs; var totalUsd=dolUsd+zelUsd; var total=totalBs;

  var fiscalVN=num(d.fiscal_ventas_netas)+num(d.fiscal_ventas_netas2), fiscalCR=num(d.fiscal_creditos), fiscalREP=num(d.fiscal_reposicion);

  var fiscalCuadre=fiscalVN-fiscalCR; var fiscalDif=fiscalTotalCaja-fiscalCuadre-fiscalREP;
  return {efBs:efBs,fondo:fondo,ventaEf:ventaEf,esperado:esperado,descuadre:descuadre,total:totalBs,totalBs:totalBs,totalUsd:totalUsd,gastosBs:gastosBs,fiscalVN:fiscalVN,fiscalCR:fiscalCR,fiscalREP:fiscalREP,fiscalTotalCaja:fiscalTotalCaja,fiscalCuadre:fiscalCuadre,fiscalDif:fiscalDif}; }
function turVerifica(k,i){

  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(raw)){ raw=raw.replace(/\./g,'').replace(',','.'); }
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(raw)){ raw=raw.replace(/,/g,''); }
  else { raw=raw.replace(',','.'); }
  var v=parseFloat(raw); return isNaN(v)?0:v;
}
function vozMetodo(t){
  var s=vozNorm(t);
  if(/zell|sell|cell|selle|zele|\bsele\b|\bcel\b|\bsel\b|\bzel\b/.test(s))return 'zelle';
  if(/dolar|divisa|verde/.test(s))return 'dolares';
  if(/transferencia|pago movil|pagomovil|movil|transfiere/.test(s))return 'transfer';
  if(/gasto/.test(s))return 'gastos';
  return null;
}
function vozBanco(t){ var s=vozNorm(t); var hit=null; (BANCOS||[]).forEach(function(b){ if(s.indexOf(vozNorm(b))>=0)hit=b; }); if(!hit){ var AL={'tesoro':'Banco del Tesoro','caribe':'Bancaribe','nacional de credito':'BNC'}; Object.keys(AL).forEach(function(k){ if(!hit && s.indexOf(k)>=0 && BANCOS.indexOf(AL[k])>=0)hit=AL[k]; }); } return hit; }
function vozEsSaltar(t){ return /\b(omitir|saltar|siguiente|ninguno|ninguna|no hay|nada)\b/.test(vozNorm(t)); }
function vozRef(t){ var d=(''+t).replace(/[^0-9]/g,''); return d||(''+t).trim(); }
function vozTitulo(t){ return (''+t).trim().replace(/[.,;]+$/,'').split(/\s+/).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' '); }
function vozCampoActual(){ if(_vozPaso<0||!_vozK)return null; var mt=meta(_vozK); return mt.campos[_vozPaso]||null; }
function vozPregunta(){
  if(_vozPaso<0)return {q:'¿Cuál es el método de pago?',hint:'Di: <b>"dólares"</b> · <b>"zelle"</b> · <b>"pago móvil"</b> · <b>"gasto"</b><br><span style="opacity:.8">Efectivo, débito y crédito van como totales al cerrar la caja</span>'};
  var c=vozCampoActual(); if(!c)return null;
  var mt=meta(_vozK); var opc=/opcional/i.test(c.t);
  if(c.k==='monto')return {q:'¿Cuál es el monto en '+mt.mon+'?',hint:'Di el número: <b>"350"</b> · <b>"13 mil 500"</b> · <b>"15 con 50"</b>'};
  if(c.k==='banco')return {q:'¿De qué banco?',hint:(window._bancoPrior?('🏦 Hoy se prioriza <b>'+esc(window._bancoPrior)+'</b><br>'):'')+'<b>"Mercantil"</b> · <b>"Provincial"</b> · <b>"Banesco"</b> · <b>"Tesoro"</b> · <b>"Bancaribe"</b> · <b>"BNC"</b>'};
  if(c.k==='ref')return {q:'¿Número de referencia'+(opc?' (o di "omitir")':'')+'?',hint:'Dicta los números: <b>"8 8 3 7 4 6"</b>'+(opc?' · o di <b>"omitir"</b>':'')};
  if(c.k==='titular')return {q:'¿Quién es el titular del Zelle?',hint:'Di el nombre: <b>"Juan Pérez"</b>'};
  if(c.k==='fact')return {q:'¿Nº de factura (o di "omitir")?',hint:'Dicta el número · o di <b>"omitir"</b>'};
  if(c.k==='concepto')return {q:'¿Cuál es el concepto del gasto?',hint:'P. ej.: <b>"almuerzo del personal"</b>'};
  return {q:c.t+'?',hint:''};
}
function vozResumen(){
  if(!_vozK)return '';
  var mt=meta(_vozK); var partes=['<b>'+mt.ic+' '+mt.n+'</b>'];
  mt.campos.forEach(function(c,i){ if(i<_vozPaso && _vozVals[c.k]!==undefined){ partes.push(c.k==='monto'?(mt.mon+' '+fmt(_vozVals[c.k])):(_vozVals[c.k]===''?'(omitido)':esc(''+_vozVals[c.k]))); } });
  return partes.join(' · ');
}
function vozPintar(){
  var p=vozPregunta(); if(!p){ vozFinalizar(); return; }
  var qEl=document.getElementById('voz-q'), hEl=document.getElementById('voz-hint'), rEl=document.getElementById('voz-res'), tEl=document.getElementById('voz-txt');

function vozIniciar(){
  if(!C||C.estado!=='abierto')return;

  cerrarModal();

  var m=document.createElement('div'); m.id='modal'; m.className='modal'; m.onclick=function(e){ if(e.target===m)vozParar(); };
  m.innerHTML='<div class="sheet" style="text-align:center">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-weight:800;font-size:18px">🎤 Dictar pago</div><button onclick="vozParar()" style="border:0;background:var(--bd);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer">×</button></div>'+
    '<div id="voz-res" style="display:none;background:#eef2ff;color:#1e38a6;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;margin-bottom:8px"></div>'+

    '<button id="voz-skip" class="btn btn-gh" style="width:100%;margin-top:8px;padding:11px;display:none" onclick="vozSaltar()">Omitir este dato</button>'+

  document.body.appendChild(m);
  if(!document.getElementById('voz-css')){ var st=document.createElement('style'); st.id='voz-css'; st.textContent='@keyframes vozpulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.45)}70%{box-shadow:0 0 0 18px rgba(180,35,24,0)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}'; document.head.appendChild(st); }

function vozArrancar(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{ if(_vozRec){_vozRec.onend=null;_vozRec.stop();} }catch(e){}
  _vozRec=new SR(); _vozRec.lang='es-VE'; _vozRec.continuous=true; _vozRec.interimResults=true; _vozRec.maxAlternatives=1; _vozActivo=true;
  _vozRec.onresult=function(ev){
    var fin='',inter='';
    for(var i=ev.resultIndex;i<ev.results.length;i++){ var r=ev.results[i]; if(r.isFinal)fin+=r[0].transcript+' '; else inter+=r[0].transcript; }
    if(fin){ _vozFinal=(_vozFinal+' '+fin).replace(/\s+/g,' ').trim(); }
    var el=document.getElementById('voz-txt'); if(el){ var txt=(_vozFinal+' '+inter).trim(); if(txt){ el.textContent='“'+txt+'”'; el.classList.remove('muted'); } }
    if(fin && _vozFinal){ vozRespuesta(_vozFinal); }
  };
  _vozRec.onerror=function(e){
    if(e.error==='no-speech'||e.error==='aborted')return;
    var el=document.getElementById('voz-txt');
    if(e.error==='not-allowed'){ _vozActivo=false; if(el)el.textContent='⚠ Permite el micrófono en el navegador'; var mic=document.getElementById('voz-mic'); if(mic)mic.style.animation='none'; }
  };
  _vozRec.onend=function(){
    if(_vozActivo && document.getElementById('voz-mic')){ setTimeout(function(){ try{ if(_vozRec&&_vozActivo)_vozRec.start(); }catch(e){} },120); }
  };
  try{ _vozRec.start(); }catch(e){}
}
function vozDetener(){ _vozActivo=false; try{ if(_vozRec){_vozRec.onend=null;_vozRec.stop();} }catch(e){} _vozRec=null; }
function vozParar(){ vozDetener(); cerrarModal(); }
function vozError(msg){ var el=document.getElementById('voz-txt'); if(el){ el.innerHTML='<span style="color:var(--red);font-size:13.5px">'+msg+'</span>'; } _vozFinal=''; }
function vozTerminar(){
  var el=document.getElementById('voz-txt');
  var vivo=(el&&el.textContent&&el.textContent.indexOf('“')===0)?el.textContent.replace(/[“”]/g,''):'';
  var txt=(_vozFinal||vivo||'').trim();

}
function vozSaltar(){ var c=vozCampoActual(); if(!c)return; _vozVals[c.k]=''; _vozFinal=''; _vozPaso++; vozPintar(); }
function vozRespuesta(txt){
  _vozFinal='';
  if(_vozPaso<0){
    var k=vozMetodo(txt);
    if(!k){ vozError('No entendí el método. Di p. ej. <b>"dólares"</b> o <b>"pago móvil"</b>'); return; }
    _vozK=k; _vozPaso=0; vozPintar(); return;
  }
  var c=vozCampoActual(); if(!c){ vozFinalizar(); return; }
  var opc=/opcional/i.test(c.t);

  else if(c.k==='banco'){ var b=vozBanco(txt); if(!b){ vozError('No reconocí el banco. Di p. ej. <b>"Banesco"</b> o <b>"Mercantil"</b>'); return; } _vozVals.banco=b; }
  else if(c.k==='ref'||c.k==='fact'){ _vozVals[c.k]=vozRef(txt); }
  else if(c.k==='titular'){ _vozVals.titular=vozTitulo(txt); }
  else { _vozVals[c.k]=(''+txt).trim(); }

}
function vozFinalizar(){

function pedirCierre(){ if(!C)return; if(pendientes()>0){ toast('Faltan firmas'); return; } scheduleSave(); (function espera(n){ if(_dirty||_saving){ if(n<=0){ toast('Guardando… intenta de nuevo en un momento'); return; } setTimeout(function(){espera(n-1);},500); return; } API('pedir_cierre',{id:C.id,por:C.cajero,turnero:esTurnero()}).then(function(r){ if(r&&r.cerrado){ C.estado='cerrado'; cerrarModal(); render(); toast('🌙 Turno cerrado. Después de las 12 entra de nuevo para abrir el día siguiente.'); return; } if(r.error==='faltan_firmas'){ toast('Faltan '+(r.pend||'')+' firmas'); return; } if(r.error){ toast('Error: '+r.error); return; } C.estado='por_confirmar'; cerrarModal(); render(); }).catch(function(){ toast('Sin conexión. Reintenta.'); }); })(12); }

function _bk(){ return 'caja_bk_'+((C&&C.id)||'x'); }
function _writeBk(dirty){ if(!C)return; try{ localStorage.setItem(_bk(), JSON.stringify({data:C.data,ver:_ver,dirty:!!dirty,ts:Date.now()})); }catch(e){} }
function _restoreBk(){ try{ if(!C)return; var raw=localStorage.getItem(_bk()); if(!raw)return; var bk=JSON.parse(raw); if(bk&&bk.dirty&&bk.data&&(Number(bk.ver)||0)>=_ver){ C.data=norm({id:C.id,data:bk.data}).data; _ver=Math.max(_ver,Number(bk.ver)||0); _dirty=true; if(typeof toast==='function')toast('Recuperé cambios sin guardar'); setTimeout(flushSave,400); } }catch(e){} }
function _syncUI(){ var b=document.getElementById('sync-banner'); if(!b)return; if(_saving||_dirty){ b.style.display='block'; if(_lastSaveOk){ b.textContent='Guardando cambios…'; b.style.background='#fef9c3'; b.style.color='#854d0e'; } else { b.textContent='⚠ Sin conexión. Tus datos están guardados en este equipo y se enviarán solos al volver la señal. No cierres la caja.'; b.style.background='#fee2e2'; b.style.color='#991b1b'; } } else { b.style.display='none'; } }
function scheduleSave(){ if(!C)return; _dirty=true; _writeBk(true); try{ localStorage.setItem('caja_sesion', JSON.stringify({id:C.id,caja:C.caja,cajero:C.cajero,fecha:C.fecha,estado:C.estado,data:C.data,ver:_ver})); }catch(e){} _syncUI(); if(!_saving)flushSave(); }
function flushSave(){ if(!C||_saving||!_dirty)return; _saving=true; _dirty=false; var ver=_ver+1; var snap=JSON.parse(JSON.stringify(C.data)); ind('Guardando…'); API('guardar',{id:C.id,data:snap,ver:ver}).then(function(r){ _saving=false; if(r&&r.ok){ _ver=r.ver||ver; _lastSaveOk=true; try{ localStorage.setItem(_bk(),JSON.stringify({data:snap,ver:_ver,dirty:false,ts:Date.now()})); }catch(e){} ind('✓ Guardado','var(--grn)'); _syncUI(); if(_dirty)flushSave(); } else { _dirty=true; _lastSaveOk=false; ind('⚠ reintentando…','var(--red)'); _syncUI(); setTimeout(flushSave,2000); } }).catch(function(){ _saving=false; _dirty=true; _lastSaveOk=false; ind('⚠ sin conexión','var(--red)'); _syncUI(); setTimeout(flushSave,3000); }); }
function abrirRelevo(){

function pedirRelevo(){ if(!C)return; if(pendientes()>0){ toast('Faltan firmas'); return; } var t=tot(); if(t.efBs<=0){ toast('Cuenta el efectivo primero'); return; } scheduleSave(); (function esp(n){ if(_dirty||_saving){ if(n<=0){ toast('Guardando… reintenta'); return; } setTimeout(function(){esp(n-1);},500); return; } API('pedir_cierre',{id:C.id,por:C.cajero,relevo:true,entrega_efectivo:t.efBs}).then(function(r){ if(r.error==='faltan_firmas'){ toast('Faltan '+(r.pend||'')+' firmas'); return; } if(r.error){ toast('Error: '+r.error); return; } C.estado='por_confirmar'; C.relevo=true; cerrarModal(); render(); toast('Entregado. Esperando visto bueno del supervisor.'); }).catch(function(){ toast('Sin conexión. Reintenta.'); }); })(12); }
