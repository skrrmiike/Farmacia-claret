<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎓 Academia Claret · Capacitación</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{font-family:Segoe UI,system-ui,Arial;margin:0;min-height:100vh;background:linear-gradient(160deg,#16267a,#1E38A6 55%,#2B47C4);color:#fff;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;color:#1a2233;border-radius:24px;max-width:560px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
h1{color:#1E38A6;font-size:21px;margin:4px 0}
input{width:100%;padding:13px;border:1.5px solid #E4E7EC;border-radius:12px;font-size:16px;text-align:center;margin:10px 0}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(140deg,#079455,#05603A);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}
.btn.gh{background:#EEF2FF;color:#1E38A6}
.gamebtn{display:flex;align-items:center;gap:12px;text-align:left;background:#F8F9FC;border:1.5px solid #E4E7EC;border-radius:14px;padding:12px 14px;cursor:pointer;margin-top:8px;width:100%}
.gamebtn:hover{border-color:#1E38A6}
.gamebtn .ic{font-size:26px} .gamebtn b{display:block;font-size:15px;color:#1a2233} .gamebtn span{font-size:11.5px;color:#667085}
.palabra{font-size:26px;font-weight:900;color:#1E38A6;margin:12px 0;min-height:40px;line-height:1.25}
.timerbar{height:12px;background:#E4E7EC;border-radius:99px;overflow:hidden;margin:8px 0}
.timerbar div{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:99px;transition:width .2s linear}
.score{font-size:38px;font-weight:900}
.hit{color:#079455}.miss{color:#B42318}
.opt{display:block;width:100%;text-align:left;background:#F8F9FC;border:1.5px solid #E4E7EC;border-radius:12px;padding:11px 13px;font-size:14px;cursor:pointer;margin-top:7px;font-weight:600;color:#1a2233}
.opt:hover{border-color:#1E38A6}
kbd{background:#1E2E52;color:#fff;border-radius:6px;padding:2px 9px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px} td,th{padding:6px 8px;border-bottom:1px solid #E4E7EC;text-align:left} th{color:#667085;font-size:10.5px;text-transform:uppercase}
.caso{background:#F8F9FC;border:1px solid #E4E7EC;border-radius:12px;padding:10px 12px;text-align:left;font-size:13px;margin:10px 0}
.caso b{color:#1E38A6}

@keyframes retFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes retBlink{0%,92%,100%{opacity:1}95%{opacity:0}}
@keyframes retPop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1)}}
@keyframes retShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ret-wrap{width:52px;height:52px;animation:retFloat 2s ease-in-out infinite;display:inline-block}
.ret-wrap.pop{animation:retPop .5s ease}
.ret-wrap.shake{animation:retShake .4s ease}
.ret-eyes{animation:retBlink 4s infinite}
</style></head><body>

 // precarga
 ['base','boca_a','boca_b','dedo','palmas','celebra'].forEach(function(p){ var i=new Image(); i.src=ACAD+'clari_'+p+'.png'; });
 ['base','boca_a','boca_b','dedo','palmas','alerta'].forEach(function(p){ var i=new Image(); i.src=ACAD+'ret_'+p+'.png'; });
 var d=document.createElement('div'); d.id='escenaWrap';
 d.innerHTML='<style>'+
 '#escenaWrap{position:fixed;inset:0;z-index:9999;background:rgba(8,12,38,.93);display:flex;align-items:center;justify-content:center;}'+
 '#escStage{position:relative;width:min(96vw,170.6vh);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#f5f8ff 0%,#E8EEF7 55%,#d7e2f2 100%);box-shadow:0 20px 60px rgba(0,0,0,.5);}'+
 '#escEst{position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(90deg,transparent 0 100px,#b9c6de 100px 107px),repeating-linear-gradient(0deg,transparent 0 64px,#c3cfe4 64px 69px);filter:blur(5px);}'+
 '#esc-clari{position:absolute;left:16%;bottom:0;height:84%;transform:translateX(-50%);transition:opacity .3s,filter .3s;filter:drop-shadow(0 6px 14px rgba(26,26,30,.28));}'+
 '#esc-ret{position:absolute;right:8%;bottom:3%;height:46%;transition:opacity .3s,filter .3s;filter:drop-shadow(0 6px 12px rgba(26,26,30,.25));animation:escFlota 2.6s ease-in-out infinite;}'+
 '@keyframes escFlota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}'+
 '.escDim{opacity:.72;filter:saturate(.8) drop-shadow(0 6px 12px rgba(26,26,30,.2)) !important;}'+
 '#escSub{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);max-width:82%;background:rgba(26,26,30,.85);color:#fff;padding:10px 20px;border-radius:12px;font-size:clamp(14px,2.2vw,22px);font-weight:700;text-align:center;opacity:0;transition:opacity .2s;line-height:1.35;}'+
 '#escSub.on{opacity:1;}'+
 '#escNom{position:absolute;left:50%;bottom:calc(4% + 3.4em);transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:1px;color:#7AC943;opacity:0;transition:opacity .2s;text-shadow:0 1px 4px rgba(0,0,0,.5);}'+
 '#escSalta{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);color:#1E38A6;border:0;border-radius:10px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);}'+
 '#escGo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(232,238,247,.55);backdrop-filter:blur(2px);}'+
 '#escGo button{background:#1E38A6;color:#fff;border:0;border-radius:14px;padding:16px 34px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 6px 18px rgba(30,56,166,.45);}'+
 '#escLogo{position:absolute;top:14px;left:16px;font-weight:900;color:#1E38A6;font-size:14px;opacity:.85;}'+
 '</style>'+
 '<div id="escStage"><div id="escEst"></div>'+
 '<div id="escLogo">🌱 Academia Claret</div>'+
 '<img id="esc-clari" src="'+ACAD+'clari_base.png" alt="Clari">'+
 '<img id="esc-ret" src="'+ACAD+'ret_base.png" alt="RET">'+
 '<div id="escNom"></div><div id="escSub"></div>'+
 '<button id="escSalta" onclick="escSalir()">⏭ Saltar introducción</button>'+
 '<div id="escGo"><button onclick="escArranca()">▶ Comenzar</button><div style="color:#1E38A6;font-weight:700;font-size:13px">Conoce a tus guías (30 segundos)</div></div>'+
 '</div>';
 document.body.appendChild(d);
}
function escVozPara(who){
 var vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(function(v){return /^es/i.test(v.lang);});
 if(!vs.length)return null;
 if(who==='clari'){ return vs.find(function(v){return /female|mujer|Paulina|Sabina|Helena|M[oó]nica|Laura|Isabela/i.test(v.name);})||vs[0]; }
 return vs.find(function(v){return /male|hombre|Jorge|Diego|Pablo|Raul|Ra[uú]l/i.test(v.name);})||vs[vs.length-1];
}
function escArranca(){
 var g=document.getElementById('escGo'); if(g)g.remove();
 if(!('speechSynthesis' in window)){ escLineaVisual(0); return; }
 escDi(0);
}
function escDi(i){
 if(!escViva)return;
 if(i>=ESC_GUION.length){ escFinal(); return; }
 var L=ESC_GUION[i], who=L[0], otro=(who==='clari'?'ret':'clari');
 var elA=document.getElementById('esc-'+who), elB=document.getElementById('esc-'+otro);
 if(elA)elA.classList.remove('escDim'); if(elB)elB.classList.add('escDim');
 escFrame(otro,'base');
 document.getElementById('escNom').textContent=(who==='clari'?'CLARI':'RET');
 document.getElementById('escNom').style.opacity=1;
 var s=document.getElementById('escSub'); s.textContent=L[1].replace(/Clarét/g,'Claret'); s.classList.add('on');
 escFrame(who,L[2]);
 var u=new SpeechSynthesisUtterance(L[1]);
 var v=escVozPara(who); if(v)u.voice=v;
 u.lang='es-419';
 if(who==='clari'){ u.rate=1.02; u.pitch=1.05; } else { u.rate=1.12; u.pitch=1.6; }
 var flapping=false;
 u.onstart=function(){
  setTimeout(function(){ if(!escViva)return; flapping=true;
   escFlapT=setInterval(function(){ if(!flapping)return; var f=Math.floor(Date.now()/130)%4; escFrame(who,f===1?'boca_a':(f===3?'boca_b':'base')); },65);
  },700);
 };
 u.onend=function(){ flapping=false; clearInterval(escFlapT); escFrame(who,'base'); setTimeout(function(){ escDi(i+1); },350); };
 u.onerror=function(){ flapping=false; clearInterval(escFlapT); escLineaVisual(i+1); };
 speechSynthesis.speak(u);
}
function escLineaVisual(i){ /* sin voz disponible: modo lectura */
 if(!escViva)return;
 if(i>=ESC_GUION.length){ escFinal(); return; }
 var L=ESC_GUION[i];
 document.getElementById('escNom').textContent=(L[0]==='clari'?'CLARI':'RET');
 document.getElementById('escNom').style.opacity=1;
 var s=document.getElementById('escSub'); s.textContent=L[1]; s.classList.add('on');
 escFrame(L[0],L[2]); escFrame(L[0]==='clari'?'ret':'clari','base');
 setTimeout(function(){ escLineaVisual(i+1); },2800);
}
function escFinal(){
 if(!escViva)return;
 escFrame('clari','celebra'); escFrame('ret','palmas');
 var c=document.getElementById('esc-clari'), r=document.getElementById('esc-ret');
 if(c)c.classList.remove('escDim'); if(r)r.classList.remove('escDim');
 var s=document.getElementById('escSub'); s.textContent='🌱 Aprendemos juntos, cuidamos vidas.'; s.classList.add('on');
 document.getElementById('escNom').style.opacity=0;
 setTimeout(function(){ escSalir(); },2600);
}
function escSalir(){
 escViva=false; clearInterval(escFlapT);
 try{ speechSynthesis.cancel(); }catch(e){}
 localStorage.setItem('academia_intro','1');
 var d=document.getElementById('escenaWrap'); if(d)d.remove();
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); if(speechSynthesis.onvoiceschanged===null) speechSynthesis.onvoiceschanged=function(){}; }

inicio();
if(!localStorage.getItem('academia_intro')) escena(true);
</script></body></html>
