<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Claret en Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f6ea3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Tablero en vivo de Farmacia Claret: planta desde arriba (y maqueta 3D) con datos reales encima. Marca azul Claret. */
  :root{
    --bg:#eef1f6; --panel:#ffffff; --ink:#122034; --ink2:#43546a; --muted:#7c8ba0;
    --line:#dbe2ea; --line2:#c6d0db; --brand:#13335c; --brand2:#2f6ea3; --accent:#2f8fd0;
    --floor:#dce2e9; --grid:#cbd3dd;
    --ok:#1f9d57; --okbg:#e5f5eb; --warn:#e0932f; --warnbg:#fbf0dd; --off:#93a0ae; --offbg:#eef1f4;
    --shadow:0 1px 3px rgba(18,32,52,.10), 0 6px 20px rgba(18,32,52,.06);
    --fDisp:'Sora',system-ui,sans-serif; --fBody:'Inter',system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0c1118; --panel:#141c26; --ink:#eaf0f7; --ink2:#b7c3d1; --muted:#8495a7;
    --line:#223040; --line2:#304153; --brand:#5fa0d6; --brand2:#4f8fc0; --accent:#5bb0e6;
    --floor:#101822; --grid:#1b2531;
    --ok:#36c074; --okbg:#10291b; --warn:#eaa94a; --warnbg:#2c2112; --off:#6b7785; --offbg:#1a232e;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c1118; --panel:#141c26; --ink:#eaf0f7; --ink2:#b7c3d1; --muted:#8495a7;
    --line:#223040; --line2:#304153; --brand:#5fa0d6; --brand2:#4f8fc0; --accent:#5bb0e6;
    --floor:#101822; --grid:#1b2531;
    --ok:#36c074; --okbg:#10291b; --warn:#eaa94a; --warnbg:#2c2112; --off:#6b7785; --offbg:#1a232e;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fBody);-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%}

  header{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--panel);border-bottom:1px solid var(--line);z-index:20;flex-wrap:wrap}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--brand),var(--brand2));display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
  .logo svg{width:20px;height:20px}
  .htitle{min-width:0}
  .htitle h1{font-family:var(--fDisp);font-weight:800;font-size:17px;margin:0;letter-spacing:-.2px;line-height:1}
  .htitle .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .livedot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(31,157,87,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,87,.45)}70%{box-shadow:0 0 0 7px rgba(31,157,87,0)}100%{box-shadow:0 0 0 0 rgba(31,157,87,0)}}
  .spacer{margin-left:auto}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:none;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:7px 15px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--brand);color:#fff}
  .hbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:650;font-size:12.5px;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}

  .kpis{display:flex;gap:10px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-width:132px;flex:1 0 auto;box-shadow:var(--shadow)}
  .kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
  .kpi .v{font-family:var(--fDisp);font-weight:800;font-size:23px;margin-top:4px;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:12px;font-weight:600;color:var(--muted)}
  .kpi .d{font-size:11px;color:var(--ink2);margin-top:3px}
  .kpi.hero .v{color:var(--brand2)}

  .stagewrap{flex:1;min-height:0;position:relative;margin:8px 16px 16px;border-radius:18px;overflow:hidden;background:var(--floor);border:1px solid var(--line);box-shadow:var(--shadow)}
  .stage{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
  #world{position:relative;margin:auto}
  #c3d{position:absolute;inset:0;display:none;touch-action:none;-ms-touch-action:none}
  body{overscroll-behavior:none}
  .legend{position:absolute;left:12px;bottom:12px;z-index:6;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:12px;padding:8px 11px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;box-shadow:var(--shadow)}
  .legend b{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
  .ldot{width:9px;height:9px;border-radius:3px}
  .updated{position:absolute;right:12px;top:12px;z-index:6;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--muted);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}

  /* áreas */
  .area{position:absolute;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(18,32,52,.14)}
  .area .nm{font-size:10.5px;font-weight:600;text-align:center;line-height:1.1;padding:2px 3px;color:#102033;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .wall{background:linear-gradient(180deg,#8fb9d8,#6c9fc6)!important;border:none!important;border-radius:2px!important;box-shadow:inset 0 2px 0 #46a277,inset 0 -2px 3px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.2)}
  .glass{background:linear-gradient(120deg,rgba(175,215,238,.55),rgba(200,230,245,.3))!important;border:1px solid #8fc0dc!important;box-shadow:inset 0 0 6px rgba(255,255,255,.5)}
  .door{background:transparent!important;border:none!important}
  .door::before{content:"";position:absolute;inset:0;border:2px dashed #b98c4e;border-radius:3px;opacity:.75}
  .gdoor{background:transparent!important;border:none!important}
  .gdoor .gl,.gdoor .gr{position:absolute;top:-30%;height:160%;width:46%;background:linear-gradient(120deg,rgba(150,200,230,.6),rgba(195,228,245,.35));border:1px solid #7fb3d6;border-radius:2px}
  .gdoor .gl{left:0;transform:rotate(16deg);transform-origin:left bottom} .gdoor .gr{right:0;transform:rotate(-16deg);transform-origin:right bottom}
  /* muebles */
  .a-shelf{border:1px solid #525c67!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.2);border-radius:3px}
  .a-nevera{border:1.5px solid #cdd6dd!important;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.2)}
  .a-nevera .split{position:absolute;top:2px;bottom:2px;left:50%;width:1px;background:rgba(80,120,150,.5)}
  .a-merca{border:1px solid #b07e2a!important;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .a-floor{border:1px solid rgba(18,32,52,.12)!important;border-radius:6px;box-shadow:inset 0 0 22px rgba(255,255,255,.18)}
  .a-floor .nm{font-weight:700;color:#0f2033;opacity:.78}
  .a-parking{border:1px solid rgba(255,255,255,.18)!important;border-radius:3px;
    background:#73787e!important;
    background-image:repeating-linear-gradient(90deg,transparent 0 44px,rgba(255,255,255,.55) 44px 48px)!important}
  .a-parking .nm{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .a-meson{border:1px solid #4d6b8a!important;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .a-pedido{border:1px dashed rgba(47,110,163,.4)!important;border-radius:8px;box-shadow:inset 0 0 20px rgba(47,110,163,.08)}
  .a-pedido .nm{color:#1f3b5c;font-weight:700;opacity:.82}
  .a-mueble{border:1px solid #8a7045!important;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(0,0,0,.2)}
  .tablec{position:absolute;border-radius:50%;background:radial-gradient(circle at 42% 38%,#c08f4f,#7f5f31);border:1px solid #5f4824;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .a-sofa{border:1px solid #39434f!important;border-radius:9px 9px 6px 6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.28)}
  .caja .mon{position:absolute;top:2px;width:34%;height:26%;background:#1c2630;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .plant{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7bbf6a,#3f7e35);box-shadow:0 1px 2px rgba(0,0,0,.25);border:1px solid #2f6128}
  .pc{position:absolute;z-index:8;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff;
    background:linear-gradient(160deg,#5a6b7e,#3f4d5c);border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 5px rgba(18,32,52,.22)}
  .pc.on{background:linear-gradient(160deg,#2f73b0,#245b8c)}
  .pc .scr{width:62%;height:40%;background:#0f1a24;border:1px solid rgba(255,255,255,.4);border-radius:2px}
  .pc.on .scr{background:#12506f;box-shadow:inset 0 0 4px rgba(130,220,255,.85)}
  .pc .pn{font-size:9px;font-weight:800;margin-top:2px;font-family:var(--fDisp)}

  /* cajas con estado */
  .caja{position:absolute;border-radius:9px;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;box-shadow:0 2px 6px rgba(18,32,52,.22);border:2px solid rgba(255,255,255,.65);padding:2px}
  .caja .cn{font-family:var(--fDisp);font-weight:800;font-size:11px;line-height:1}
  .caja .cw{font-size:8.5px;font-weight:600;opacity:.95;line-height:1.05;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
  .caja.abierto{background:linear-gradient(160deg,#25a862,#1a8650)}
  .caja.descanso{background:linear-gradient(160deg,#eaa23a,#d07f17)}
  .caja.cerrado{background:linear-gradient(160deg,#8e9aa8,#6f7d8c);box-shadow:0 1px 3px rgba(18,32,52,.14)}
  .caja.abierto::after{content:"";position:absolute;inset:-4px;border-radius:12px;border:2px solid #25a862;opacity:.5;animation:ring 2.2s infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.5}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
  .pin{position:absolute;z-index:9;transform:translate(-50%,-100%);font-size:11px;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;box-shadow:var(--shadow);white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:5px;pointer-events:none}
  .pin b{color:var(--brand2);font-weight:800}

  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;z-index:30;background:var(--floor)}
  .loading[hidden]{display:none}
  .ctrl3d{position:absolute;right:12px;bottom:14px;z-index:8;display:flex;flex-direction:column;gap:7px}
  .ctrl3d[hidden]{display:none}
  .ctrl3d button{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);color:var(--ink);font-size:22px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .ctrl3d button:active{transform:scale(.94)}
  @media (max-width:560px){ .htitle .sub span.hidem{display:none} .kpi{min-width:118px} }
  @media (prefers-reduced-motion:reduce){ .livedot,.caja.abierto::after,.alertdot,.beacon{animation:none} }

  /* clic para inspeccionar */
  .area[data-k],.caja{cursor:pointer}
  .area[data-k]:hover{filter:brightness(1.05)}
  /* alerta sobre supervisores */
  .alertdot{position:absolute;z-index:11;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;
    background:#e23b3b;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(226,59,59,.6);animation:apulse 1.4s infinite;border:2px solid #fff}
  @keyframes apulse{0%{box-shadow:0 0 0 0 rgba(226,59,59,.55)}70%{box-shadow:0 0 0 10px rgba(226,59,59,0)}100%{box-shadow:0 0 0 0 rgba(226,59,59,0)}}
  /* banner de alertas */
  .albanner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 16px 4px;padding:9px 13px;border-radius:12px;
    background:linear-gradient(90deg,#fdecec,#fbe3d8);border:1px solid #f1b9b0;color:#9a2a22;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
  .albanner[hidden]{display:none!important}
  :root[data-theme="dark"] .albanner,:root:not([data-theme="light"]) .albanner{}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .albanner{background:linear-gradient(90deg,#3a1b18,#38231a);border-color:#6e342c;color:#f1b4ab} }
  :root[data-theme="dark"] .albanner{background:linear-gradient(90deg,#3a1b18,#38231a);border-color:#6e342c;color:#f1b4ab}
  .albanner .chip{background:rgba(226,59,59,.16);border:1px solid rgba(226,59,59,.35);border-radius:999px;padding:2px 9px;font-weight:700}

  /* panel inferior de info */
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(110%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
    background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(10,16,22,.3);
    padding:14px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto}
  .panel.on{transform:translateY(0)}
  .panel .ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
  .panel .pic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--bg);border:1px solid var(--line)}
  .panel h2{font-family:var(--fDisp);font-size:17px;margin:0;font-weight:800}
  .panel .psub{font-size:12px;color:var(--muted);margin-top:2px}
  .panel .x{margin-left:auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;flex:none}
  .stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .stat .s{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:92px;flex:1 0 auto}
  .stat .s .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .stat .s .v{font-family:var(--fDisp);font-weight:800;font-size:18px;margin-top:3px;font-variant-numeric:tabular-nums}
  .plist{display:flex;flex-direction:column;gap:2px}
  .plist .r{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 2px;border-bottom:1px solid var(--line)}
  .plist .r .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plist .r .q{font-weight:800;font-variant-numeric:tabular-nums}
  .plist .r.low .q{color:#d8632b}
  .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:70px;flex:none}
  .bar>i{display:block;height:100%;background:var(--brand2)}
  .alertrow{display:flex;align-items:center;gap:8px;background:var(--warnbg);border:1px solid #e9c488;color:#8a5a12;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:6px;font-weight:600}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .alertrow{background:#2c2112;border-color:#5e4620;color:#e7b662} }
  :root[data-theme="dark"] .alertrow{background:#2c2112;border-color:#5e4620;color:#e7b662}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(8,14,20,.3);opacity:0;pointer-events:none;transition:opacity .24s}
  .scrim.on{opacity:1;pointer-events:auto}
  /* modo editar */
  #editlayer{position:absolute;inset:0;z-index:40}
  .eh{position:absolute;border:1.5px dashed rgba(47,110,163,.65);border-radius:4px;background:rgba(47,110,163,.05);cursor:grab;touch-action:none}
  .eh.sel{border:2px solid var(--brand2);background:rgba(47,110,163,.16);z-index:45}
  .eh .rs{position:absolute;right:-8px;bottom:-8px;width:17px;height:17px;background:var(--brand2);border:2px solid #fff;border-radius:3px;cursor:nwse-resize;touch-action:none;display:none}
  .eh.sel .rs{display:block}
  .edithint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:46;background:var(--brand);color:#fff;border-radius:999px;padding:5px 13px;font-size:11px;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
  .edithint[hidden]{display:none!important}
  .etool{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:75;display:flex;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 -4px 20px rgba(10,16,22,.25)}
  .etool[hidden]{display:none!important}
  .etool button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:650;font-size:12.5px;padding:9px 11px;border-radius:9px;cursor:pointer}
  .etool button.del{background:var(--danger);border-color:var(--danger);color:#fff}
  #editBtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .addgrid button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:12px 6px;border-radius:11px;cursor:pointer}
  .pgate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#2f6ea3,#244f78);padding:24px}
  .pgate.hide{display:none}
  .pgate-card{background:#fff;border-radius:22px;padding:30px 26px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .pgate-logo{width:54px;height:54px;border-radius:15px;background:#eaf2f9;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .pgate-logo svg{width:28px;height:28px}
  .pgate-card h2{margin:0;font-size:20px;color:#163a5a;font-weight:800}
  .pgate-card p{margin:4px 0 18px;font-size:13px;color:#6b7a89}
  .pgate-card input{width:100%;box-sizing:border-box;text-align:center;font-size:22px;letter-spacing:6px;padding:12px;border:1.5px solid #d6dee6;border-radius:13px;outline:none;font-family:inherit}
  .pgate-card input:focus{border-color:#2f6ea3}
  .pgate-err{min-height:16px;color:#d14343;font-size:12.5px;margin:8px 0 2px}
  .pgate-card button{width:100%;margin-top:6px;padding:13px;border:none;border-radius:13px;background:#2f6ea3;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .pgate-card button:disabled{opacity:.6}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></div>
    <div class="htitle">
      <h1>Claret en Vivo</h1>
      <div class="sub"><span class="livedot" id="liveDot"></span><span id="liveTxt">Conectado</span><span class="hidem">· <span id="fechaTxt">—</span></span></div>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg">
      <button class="on" data-v="2d" onclick="setView('2d')">Planta</button>
      <button data-v="3d" onclick="setView('3d')">3D</button>
    </div>

function updateCam(){ var cxw=CENTER_X+(cam.tx||0), czw=CENTER_Z+(cam.tz||0);
  var x=cxw+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta),y=cam.r*Math.cos(cam.phi),z=czw+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta);
  camera.position.set(x,y,z); camera.lookAt(cxw,0,czw); }
function resize3D(){ var w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); if(!camera) camera=new THREE.PerspectiveCamera(48,w/h,0.1,200); camera.aspect=w/h; camera.updateProjectionMatrix(); updateCam(); }
function renderOnce(){ if(renderer&&scene&&camera){ updateCam(); renderer.render(scene,camera); } }
function pickAt(e){
  if(!camera||!renderer||!P3.length) return;
  var rect=document.getElementById('c3d').getBoundingClientRect();
  var m=new THREE.Vector2(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1);
  raycaster.setFromCamera(m,camera);
  var hits=raycaster.intersectObjects(P3,false);
  if(hits.length&&hits[0].object.userData.k) inspect(hits[0].object.userData.k);
}

    else if(k.length===2){pd0=dist(pts[k[0]],pts[k[1]]);r0=cam.r; pm0=mid(pts[k[0]],pts[k[1]]); tg0={x:cam.tx||0,z:cam.tz||0};}

      var m=mid(p1,p2); if(pm0&&tg0){ var sc=cam.r/520; cam.tx=tg0.x-(m.x-pm0.x)*sc; cam.tz=tg0.z-(m.y-pm0.y)*sc; cam.tx=Math.max(-8,Math.min(8,cam.tx)); cam.tz=Math.max(-7,Math.min(7,cam.tz)); }

    if(o){ cam.theta=o.th+(e.clientX-o.x)*0.009; cam.phi=Math.max(0.22,Math.min(1.45,o.ph-(e.clientY-o.y)*0.007)); renderOnce(); } },{passive:false});

// Cajas y alertas: función edge 'caja' acción 'dia' (igual que la app de cajeros)
function fetchCajas(){ return cajaApi('dia',{fecha:ymdCaracas(),empresa:'farmacia'}).then(function(res){
  if(!res||res.error){ LIVE.conectado=false; return; }
  var cierres=res.cierres||[], firmas=res.firmas||[];
  function firmada(cid,lid){ for(var i=0;i<firmas.length;i++){ if(firmas[i].cierre_id===cid && firmas[i].linea_id===lid) return true; } return false; }
  function sum(arr){ return (arr||[]).reduce(function(a,x){ return a+(Number(x.monto)||0); },0); }
  // cierre activo (o el más reciente) por caja
  var byCaja={};
  cierres.forEach(function(c){ var k=c.caja||''; if(!k) return; var act=(c.estado==='abierto'||c.estado==='descanso'||c.estado==='por_confirmar');
    var cur=byCaja[k]; if(!cur || (act&&!cur._act) || ((c.id||0)>(cur.id||0))){ c._act=act; byCaja[k]=c; } });
  var cajas={}, alerts={zelle:[],efectivo:[],transfer:[]}, gente=0, yp={pcs:0,online:0,list:[]};
  Object.keys(byCaja).forEach(function(k){ var c=byCaja[k]; var d=c.data||{}; if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){ d={}; } }
    var estado = c.estado==='abierto'?'abierto':((c.descanso||c.estado==='descanso')?'descanso':(c.estado==='por_confirmar'?'abierto':'cerrado'));
    var abierta=(estado!=='cerrado');
    var totBs=sum(d.efectivobs)+sum(d.transfer)+sum(d.debito)+sum(d.credito);   // Bs
    var totUsd=sum(d.dolares)+sum(d.zelle);                                      // $ (separado)
    var pend=[];
    [['zelle','zelle'],['transfer','transfer'],['dolares','efectivo']].forEach(function(p){ (d[p[0]]||[]).forEach(function(x){
      if((Number(x.monto)||0)>0 && x.solic && !firmada(c.id,x.id)){ var al={caja:k,titular:x.titular||x.banco||'',monto:Number(x.monto)||0,metodo:p[0]}; pend.push(al); alerts[p[1]].push(al); } }); });
    var esYP=/yapag|yp\b/i.test(k);
    if(esYP){ var mm=k.match(/(\d+)/); yp.pcs++; if(abierta)yp.online++; yp.list.push({n:'PC '+(mm?mm[1]:yp.pcs),online:abierta,usuario:c.cajero||'Pedidos WhatsApp'}); }
    else { cajas[k]={estado:estado,cajero:c.cajero||'',abrio:horaCaracas(c.abierto_en),total_bs:totBs,total_usd:totUsd,pend:pend}; }
    if(abierta) gente++;
  });
  LIVE.cajas=cajas; LIVE.alerts=alerts; LIVE.gente=gente; if(yp.pcs) LIVE.yapague=yp;
  LIVE.conectado=true; LIVE.fecha=ymdCaracas(); LIVE.ultima_sync=nowHM();
}).catch(function(){ LIVE.conectado=false; }); }

// Stock por categoría: op-api 'estado' (op_productos + existencia real)
function fetchStock(){ return opApi('estado').then(function(d){ var prods=d.productos||[];
  function grp(cats){ var items=[],tot=0; prods.forEach(function(p){ if(cats.indexOf(p.cat)>=0){ var ex=Number(p.existencia)||0; if(ex>0){ items.push([p.nombre||p.descr||p.codigo||'—',ex]); tot+=ex; } } }); items.sort(function(a,b){ return b[1]-a[1]; }); return {total:tot,items:items.slice(0,12)}; }
  LIVE.stock={ bebidas:grp(['pepsi','coca']), chuche:grp(['chuche']), medicina:grp(['medicina']) };
}).catch(function(){}); }

// Ventas del día (A2): RPC gerente_ventas_farmacia
function fetchVentas(){ if(!sb) return Promise.resolve(); return sb.rpc('gerente_ventas_farmacia').then(function(res){
  if(res.error||!res.data) return; var dias=res.data.por_dia||[]; var hoy=ymdCaracas(), t=null;
  for(var i=dias.length-1;i>=0;i--){ if(String(dias[i].dia||'').slice(0,10)===hoy){ t=dias[i]; break; } }
  if(!t && dias.length) t=dias[dias.length-1];
  if(t){ LIVE.ventas_uds=Number(t.uds)||0; LIVE.operaciones=Number(t.skus)||0; }
}).catch(function(){}); }

function refreshAll(){ return Promise.all([fetchCajas(),fetchStock(),fetchEntradas(),fetchVentas()]).then(function(){ var l=document.getElementById('loading'); if(l) l.hidden=true; repaint(); }); }
function startLive(){ refreshAll();
  setInterval(function(){ fetchCajas().then(repaint); }, 8000);          // estado de cajas: casi en vivo
  setInterval(function(){ fetchStock(); fetchEntradas(); fetchVentas().then(repaint); }, 60000);
  // realtime opcional por postgres_changes
  try{ if(sb) sb.channel('planta-rt').on('postgres_changes',{event:'*',schema:'public',table:'cierres_caja'},function(){ fetchCajas().then(repaint); }).subscribe(); }catch(e){}
}

    .catch(function(ex){ PIN=''; if(ex&&ex.pin){ try{ localStorage.removeItem(PINKEY); }catch(_){} } document.getElementById('pgate').classList.remove('hide'); setTimeout(function(){ if(inp) inp.focus(); },120); }); }
  else { document.getElementById('pgate').classList.remove('hide'); setTimeout(function(){ if(inp) inp.focus(); },120); }
}
